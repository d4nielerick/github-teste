<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #1d1d1f;
      background-color: #fff;
      text-align: center;
    }
    .nav {
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 14px;
    }
    .hero {
      padding: 80px 20px;
    }
    h1 {
      font-size: 56px;
      font-weight: 600;
      margin: 0 0 20px;
    }
    p {
      font-size: 24px;
      margin: 0 0 40px;
    }
    .btn {
      padding: 12px 28px;
      font-size: 17px;
      background-color: #0071e3;
      color: #fff;
      border: none;
      border-radius: 980px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #0077ed;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <span>Logo</span>
    <span>Produtos</span>
    <span>Suporte</span>
  </nav>
  <section class="hero">
    <h1>Bem-vindo</h1>
    <p>Descubra experiências incríveis com um design limpo e moderno.</p>
    <button class="btn">Saiba Mais</button>
  </section>
</body>
</html>
